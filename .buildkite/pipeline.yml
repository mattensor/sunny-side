steps:
  - label: ":typescript: Type check"
    command: "npm ci && npm run check"
    image: "node:22"

  - label: ":biome: Lint"
    command: "npm ci && npm run lint"
    image: "node:22"
  - label: "Vitest"
    command: npm ci && bktec run
    plugins:
      - tests#v1.0.0:
          test-runner: jest
          test-cmd: "npx vitest run {{testExamples}} --reporter=json --outputFile={{resultPath}}"
          result-path: tmp/vitest-results.json
    parallelism: 2
    image: "node:22"
    env:
      NODE_ENV: "test"